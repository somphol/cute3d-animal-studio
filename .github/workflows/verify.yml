name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine + repository checks
        run: npm test
      - name: Browser checks
        run: npm run test:browser
        env:
          CHROME: /usr/bin/google-chrome
