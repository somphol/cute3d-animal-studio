<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in the studio — Cute3D</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: radial-gradient(900px 700px at 20% 10%, #fff6e8, transparent 60%),
                  radial-gradient(900px 700px at 85% 20%, #ffe7f0, transparent 60%),
                  linear-gradient(155deg, #fffaf4, #efe9fb);
      font-family: "Nunito", "Avenir Next Rounded", ui-rounded, system-ui, sans-serif;
      color: #352a2e; padding: 24px; text-align: center;
    }
    main { max-width: 460px; }
    .pet { font-size: 64px; line-height: 1; }
    h1 { font-size: clamp(26px, 6vw, 38px); letter-spacing: -0.03em; margin: 18px 0 8px; }
    p { color: #6c5c61; line-height: 1.6; margin: 0 0 24px; }
    a {
      display: inline-block; padding: 12px 22px; border-radius: 999px;
      background: #352a2e; color: #fff; text-decoration: none; font-weight: 800; font-size: 14px;
    }
    a:focus-visible { outline: 3px solid #e8789a; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="pet" aria-hidden="true">🐾</div>
    <h1>This pet wandered off</h1>
    <p>The page you asked for does not exist. The studio is still here, with four friends waiting.</p>
    <a href="./">Back to the studio</a>
  </main>
</body>
</html>
